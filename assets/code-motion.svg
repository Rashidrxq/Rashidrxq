<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
    <stop offset=".18" stop-color="#00d4ff" stop-opacity=".9"/>
    <stop offset=".82" stop-color="#00d4ff" stop-opacity=".9"/>
    <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1200" height="260"/></clipPath>
</defs>
<rect width="1200" height="260" fill="#050b14"/>
<g clip-path="url(#clip)" font-family="monospace" font-size="15" fill="#00d4ff" opacity=".72" filter="url(#glow)">
  <g><text x="40" y="-30">const build = async () =&gt; {</text><text x="40" y="-5">  await ship(product);</text><text x="40" y="20">};</text><animateTransform attributeName="transform" type="translate" from="0 -30" to="0 300" dur="7s" repeatCount="indefinite"/></g>
  <g opacity=".55"><text x="320" y="-90">import React from "react";</text><text x="320" y="-65">export default App;</text><animateTransform attributeName="transform" type="translate" from="0 -90" to="0 340" dur="9s" repeatCount="indefinite"/></g>
  <g><text x="650" y="-150">SELECT * FROM projects;</text><text x="650" y="-125">WHERE status = 'building';</text><animateTransform attributeName="transform" type="translate" from="0 -150" to="0 350" dur="8s" repeatCount="indefinite"/></g>
  <g opacity=".6"><text x="930" y="-220">git commit -m "ship"</text><text x="930" y="-195">git push origin main</text><animateTransform attributeName="transform" type="translate" from="0 -220" to="0 330" dur="10s" repeatCount="indefinite"/></g>

  <g><text x="170" y="300">function solve(problem) { return code; }</text><animateTransform attributeName="transform" type="translate" from="0 300" to="0 -330" dur="8s" repeatCount="indefinite"/></g>
  <g opacity=".55"><text x="500" y="360">python train(model, data)</text><animateTransform attributeName="transform" type="translate" from="0 360" to="0 -360" dur="11s" repeatCount="indefinite"/></g>
  <g><text x="820" y="320">npm run build && deploy()</text><animateTransform attributeName="transform" type="translate" from="0 320" to="0 -350" dur="9s" repeatCount="indefinite"/></g>
</g>
<rect x="0" y="0" width="1200" height="260" fill="url(#fade)" opacity=".25"/>
<line x1="0" y1="259" x2="1200" y2="259" stroke="#00d4ff" stroke-opacity=".35"/>
<text x="600" y="242" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="4" fill="#8b949e">CODE IN MOTION · BUILD · SHIP · ITERATE</text>
</svg>